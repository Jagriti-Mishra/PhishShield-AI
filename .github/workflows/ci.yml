name: PhishShield AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install anyio pytest-asyncio

      - name: Seed Brand Signatures & Visual Templates
        env:
          PYTHONPATH: backend
        run: |
          python backend/seed_brand_data.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v
